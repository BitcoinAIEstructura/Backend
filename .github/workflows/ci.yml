name: CI

on:
  push:
  pull_request:

jobs:
  pruebas:
    name: ruff, mypy y pytest (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Instalar el proyecto y las herramientas
        run: pip install -e ".[dev]"

      - name: Estilo (ruff)
        run: ruff check

      - name: Tipos (mypy)
        run: mypy src

      - name: Pruebas (pytest)
        run: pytest

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs: pruebas
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Construir la imagen
        run: docker build -t bitcoinai-backend .

      - name: Arrancar el contenedor y probar /health
        run: |
          docker run -d --name backend -p 8080:8080 bitcoinai-backend
          for i in $(seq 1 30); do
            if curl -fsS localhost:8080/health; then exit 0; fi
            sleep 1
          done
          docker logs backend
          exit 1
