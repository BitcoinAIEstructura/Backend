name: CI

on:
  push:
  pull_request:

jobs:
  pruebas:
    name: mvn test (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ejecutar las pruebas
        run: mvn -B test
