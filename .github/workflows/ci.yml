name: CI

on:
  push:
  pull_request:

jobs:
  pruebas:
    name: ruff, mypy y pytest (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Instalar el proyecto y las herramientas
        run: pip install -e ".[dev]"

      - name: Estilo (ruff)
        run: ruff check

      - name: Tipos (mypy)
        run: mypy src

      - name: Pruebas (pytest)
        run: pytest

